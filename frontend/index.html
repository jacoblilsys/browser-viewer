<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sensor Viewer</title>
  <link rel="stylesheet" href="/static/style.css" />
  <!-- uPlot: lightweight high-performance charting -->
  <link  rel="stylesheet" href="https://unpkg.com/uplot@1.6.31/dist/uPlot.min.css" />
  <script src="https://unpkg.com/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
</head>
<body>

<header class="topbar">
  <span class="app-title">Lillie System</span>
  <span class="host-info" id="host-info">This host (Server): —</span>
  <div class="topbar-right">
    <button class="theme-btn" id="btn-theme" title="Toggle light/dark theme">
      <span id="theme-icon">&#9788;</span>
    </button>
  </div>
</header>

<main class="layout">

  <!-- ── Charts area ── -->
  <section class="chart-panel">
    <div class="chart-toolbar">
      <div class="chart-sensor-info">
        <span class="dot" id="dot-sensor" title="Sensor TCP"></span>
        <span id="lbl-device">No device</span>
        <span class="sep">|</span>
        <span id="lbl-rate">— Hz</span>
        <span class="sep">|</span>
        <span class="dot" id="dot-log" title="Logging"></span>
        <span id="lbl-log">Not logging</span>
        <span class="sep">|</span>
        <span class="dot" id="dot-ws" title="WebSocket"></span>
        <span id="lbl-ws">Connecting…</span>
      </div>
      <div class="chart-controls">
        <label>Layout
          <select id="sel-layout">
            <option value="raw-only">Raw Only</option>
            <option value="1+3-vert">Raw + 3 FFT</option>
            <option value="2x2">2x2 Grid</option>
            <option value="side-by-side">Side by Side</option>
            <option value="raw+1fft">Raw + Combined FFT</option>
          </select>
        </label>
        <label>Window
          <select id="sel-window">
            <option value="2">2 s</option>
            <option value="5" selected>5 s</option>
            <option value="10">10 s</option>
            <option value="30">30 s</option>
          </select>
        </label>
        <label>
          <input type="checkbox" id="chk-envelope" checked />
          Min/max envelope
        </label>
        <select id="sel-log-format" class="log-format-select" title="Log file format">
          <option value="tsv">TSV</option>
          <option value="hdf5">HDF5</option>
        </select>
        <button id="btn-log" class="btn">Start Logging</button>
        <button id="btn-clear" class="btn">Clear</button>
      </div>
    </div>

    <section class="charts-area layout-raw-only" id="charts-area">
      <div class="chart-container" id="chart-raw">
        <div class="chart-label">Raw Waveform</div>
        <div class="chart-canvas" id="chart-raw-canvas"></div>
        <div class="legend">
          <span class="leg-x">— X</span>
          <span class="leg-y">— Y</span>
          <span class="leg-z">— Z</span>
        </div>
      </div>
      <div class="chart-container chart-fft" id="chart-fft-x" hidden>
        <div class="chart-label">FFT — X Axis</div>
        <div class="chart-canvas" id="chart-fft-x-canvas"></div>
      </div>
      <div class="chart-container chart-fft" id="chart-fft-y" hidden>
        <div class="chart-label">FFT — Y Axis</div>
        <div class="chart-canvas" id="chart-fft-y-canvas"></div>
      </div>
      <div class="chart-container chart-fft" id="chart-fft-z" hidden>
        <div class="chart-label">FFT — Z Axis</div>
        <div class="chart-canvas" id="chart-fft-z-canvas"></div>
      </div>
      <div class="chart-container chart-fft" id="chart-fft-combined" hidden>
        <div class="chart-label">FFT — All Axes</div>
        <div class="chart-canvas" id="chart-fft-combined-canvas"></div>
        <div class="legend">
          <span class="leg-x">— X</span>
          <span class="leg-y">— Y</span>
          <span class="leg-z">— Z</span>
        </div>
      </div>
    </section>
  </section>

  <!-- ── Sidebar ── -->
  <aside class="sidebar">

    <details open>
      <summary>Devices on Network <button class="btn btn-sm" id="btn-refresh-devices" title="Refresh">&#x21bb;</button></summary>
      <div class="card">
        <div id="device-list" class="device-list">
          <div class="device-empty">Scanning...</div>
        </div>
      </div>
    </details>

    <details id="panel-sensor" open>
      <summary>Selected Sensor</summary>
      <div class="card">
        <div class="selected-info" id="selected-info">No sensor selected</div>
        <label>Password
          <span class="pw-wrap">
            <input type="password" id="in-pw" placeholder="(empty)" />
            <button type="button" class="btn-toggle-pw" id="btn-toggle-pw" title="Show/hide password">&#128065;</button>
          </span>
        </label>
        <div class="btn-row">
          <button class="btn" id="btn-get-info">Get Info</button>
          <button class="btn" id="btn-stream-start">Stream ▶</button>
          <button class="btn" id="btn-stream-stop">Stream ■</button>
          <button class="btn btn-danger" id="btn-reset">Reset</button>
        </div>
      </div>
    </details>

    <details>
      <summary>Sensor Config</summary>
      <div class="card">
        <label>Full scale
          <select id="cfg-fs">
            <option>ACCEL_FS_2G</option>
            <option>ACCEL_FS_4G</option>
            <option>ACCEL_FS_8G</option>
            <option>ACCEL_FS_16G</option>
          </select>
        </label>
        <label>Axes
          <select id="cfg-axes">
            <option>AXIS_XYZ</option>
            <option>AXIS_X</option>
            <option>AXIS_Y</option>
            <option>AXIS_Z</option>
            <option>AXIS_XY</option>
            <option>AXIS_XZ</option>
            <option>AXIS_YZ</option>
          </select>
        </label>
        <label>ODR divisor
          <select id="cfg-odr">
            <option>ODR_DIV_1</option>
            <option>ODR_DIV_2</option>
            <option>ODR_DIV_4</option>
            <option>ODR_DIV_8</option>
            <option>ODR_DIV_16</option>
            <option>ODR_DIV_32</option>
          </select>
        </label>
        <label>Filter
          <select id="cfg-filt">
            <option>FILTER_NONE</option>
            <option>FILTER_LOW_PASS2</option>
            <option>FILTER_HIGH_PASS</option>
            <option>FILTER_SLOPE_FILTER</option>
          </select>
        </label>
        <label>Cutoff
          <select id="cfg-cutoff">
            <option>CUTOFF_6p66_KHZ</option>
            <option>CUTOFF_2p66_KHZ</option>
            <option>CUTOFF_1p33_KHZ</option>
            <option>CUTOFF_0p59_KHZ</option>
            <option>CUTOFF_0p26_KHZ</option>
            <option>CUTOFF_NONE</option>
          </select>
        </label>
        <label>FFT Size
          <select id="cfg-fft-size">
            <option>FFT_SIZE_256</option>
            <option>FFT_SIZE_512</option>
            <option>FFT_SIZE_1024</option>
            <option>FFT_SIZE_2048</option>
          </select>
        </label>
        <div class="btn-row">
          <button class="btn" id="btn-get-cfg">Get Config</button>
          <button class="btn btn-primary" id="btn-set-cfg">Apply</button>
        </div>
      </div>
    </details>

    <details>
      <summary>FFT Config</summary>
      <div class="card">
        <label>FFT Stream
          <select id="net-fft-stream">
            <option>FEATURE_DISABLED</option>
            <option>FEATURE_ENABLED</option>
          </select>
        </label>
        <div class="btn-row">
          <button class="btn" id="btn-fft-start">FFT Start</button>
          <button class="btn" id="btn-fft-stop">FFT Stop</button>
        </div>
      </div>
    </details>

    <details>
      <summary>Network Config</summary>
      <div class="card">
        <label>IP           <input type="text" id="net-ip"  /></label>
        <label>Netmask      <input type="text" id="net-mask"/></label>
        <label>Gateway      <input type="text" id="net-gw"  /></label>
        <label>Server IP    <input type="text" id="net-server-ip" /></label>
        <label>Server Port  <input type="text" id="net-server-port" /></label>
        <label>NTP Server   <input type="text" id="net-ntp-ip" /></label>
        <label>DHCP
          <select id="net-dhcp">
            <option>FEATURE_DISABLED</option>
            <option>FEATURE_ENABLED</option>
          </select>
        </label>
        <label>Data Stream
          <select id="net-stream">
            <option>FEATURE_DISABLED</option>
            <option>FEATURE_ENABLED</option>
          </select>
        </label>
        <div class="btn-row">
          <button class="btn" id="btn-get-net">Get Config</button>
          <button class="btn btn-primary" id="btn-set-net">Apply</button>
        </div>
      </div>
    </details>

  </aside>
</main>

<!-- ── Console output at bottom ── -->
<footer class="console-footer">
  <pre id="out-info" class="output-box"></pre>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
