<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sensor Viewer</title>
  <link rel="stylesheet" href="/static/style.css" />
  <!-- uPlot: lightweight high-performance charting -->
  <link  rel="stylesheet" href="https://unpkg.com/uplot@1.6.31/dist/uPlot.min.css" />
  <script src="https://unpkg.com/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
</head>
<body>

<header class="topbar">
  <span class="app-title">Sensor Viewer</span>
  <div class="status-row">
    <span class="dot" id="dot-sensor" title="Sensor TCP"></span>
    <span id="lbl-device">No device</span>
    <span class="sep">|</span>
    <span id="lbl-rate">— Hz</span>
    <span class="sep">|</span>
    <span class="dot" id="dot-log" title="Logging"></span>
    <span id="lbl-log">Not logging</span>
    <span class="sep">|</span>
    <span class="dot" id="dot-ws" title="WebSocket"></span>
    <span id="lbl-ws">Connecting…</span>
  </div>
</header>

<main class="layout">

  <!-- ── Chart panel ── -->
  <section class="chart-panel">
    <div class="chart-toolbar">
      <label>Window
        <select id="sel-window">
          <option value="2">2 s</option>
          <option value="5" selected>5 s</option>
          <option value="10">10 s</option>
          <option value="30">30 s</option>
        </select>
      </label>
      <label>
        <input type="checkbox" id="chk-envelope" checked />
        Min/max envelope
      </label>
      <button id="btn-log" class="btn">Start Logging</button>
      <button id="btn-clear" class="btn">Clear</button>
    </div>
    <div id="chart"></div>
    <div class="legend">
      <span class="leg-x">— X</span>
      <span class="leg-y">— Y</span>
      <span class="leg-z">— Z</span>
    </div>
  </section>

  <!-- ── Sidebar ── -->
  <aside class="sidebar">

    <details open>
      <summary>Sensor Control</summary>
      <div class="card">
        <label>IP <input type="text" id="in-ip"  placeholder="192.168.1.100" /></label>
        <label>MAC<input type="text" id="in-mac" placeholder="aa:bb:cc:dd:ee:ff" /></label>
        <label>Password<input type="password" id="in-pw" placeholder="(empty)" /></label>
        <div class="btn-row">
          <button class="btn" id="btn-get-info">Get Info</button>
          <button class="btn" id="btn-stream-start">Stream ▶</button>
          <button class="btn" id="btn-stream-stop">Stream ■</button>
          <button class="btn btn-danger" id="btn-reset">Reset</button>
        </div>
        <pre id="out-info" class="output-box"></pre>
      </div>
    </details>

    <details>
      <summary>Sensor Config</summary>
      <div class="card">
        <label>Full scale
          <select id="cfg-fs">
            <option>ACCEL_FS_2G</option>
            <option>ACCEL_FS_4G</option>
            <option>ACCEL_FS_8G</option>
            <option>ACCEL_FS_16G</option>
          </select>
        </label>
        <label>Axes
          <select id="cfg-axes">
            <option>AXIS_XYZ</option>
            <option>AXIS_X</option>
            <option>AXIS_Y</option>
            <option>AXIS_Z</option>
            <option>AXIS_XY</option>
            <option>AXIS_XZ</option>
            <option>AXIS_YZ</option>
          </select>
        </label>
        <label>ODR divisor
          <select id="cfg-odr">
            <option>ODR_DIV_1</option>
            <option>ODR_DIV_2</option>
            <option>ODR_DIV_4</option>
            <option>ODR_DIV_8</option>
            <option>ODR_DIV_16</option>
            <option>ODR_DIV_32</option>
          </select>
        </label>
        <label>Filter
          <select id="cfg-filt">
            <option>FILTER_NONE</option>
            <option>FILTER_LOW_PASS2</option>
            <option>FILTER_HIGH_PASS</option>
            <option>FILTER_SLOPE_FILTER</option>
          </select>
        </label>
        <label>Cutoff
          <select id="cfg-cutoff">
            <option>CUTOFF_6p66_KHZ</option>
            <option>CUTOFF_2p66_KHZ</option>
            <option>CUTOFF_1p33_KHZ</option>
            <option>CUTOFF_0p59_KHZ</option>
            <option>CUTOFF_0p26_KHZ</option>
            <option>CUTOFF_NONE</option>
          </select>
        </label>
        <div class="btn-row">
          <button class="btn" id="btn-get-cfg">Get Config</button>
          <button class="btn btn-primary" id="btn-set-cfg">Apply</button>
        </div>
      </div>
    </details>

    <details>
      <summary>Network Config</summary>
      <div class="card">
        <label>IP       <input type="text" id="net-ip"  /></label>
        <label>Netmask  <input type="text" id="net-mask"/></label>
        <label>Gateway  <input type="text" id="net-gw"  /></label>
        <label>DHCP
          <select id="net-dhcp">
            <option>FEATURE_DISABLED</option>
            <option>FEATURE_ENABLED</option>
          </select>
        </label>
        <div class="btn-row">
          <button class="btn" id="btn-get-net">Get Config</button>
          <button class="btn btn-primary" id="btn-set-net">Apply</button>
        </div>
      </div>
    </details>

  </aside>
</main>

<script src="/static/app.js"></script>
</body>
</html>
